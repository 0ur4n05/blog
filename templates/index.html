<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lmngol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>

<body>
    <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Toggle Menu">
        <i class="fas fa-bars"></i>
    </button>
    <div class="overlay" id="overlay"></div>

    <div class="container">
        <div class="file-tree" id="fileTree"></div>
        <div class="file">
            <div class="file-data" id="file-data">
                <div id="file-path">
                    <h1 class="file-path-txt" id="file-path-txt"></h1>
                    <div id="cursor"></div>
                </div>
                <div id="download-container">
                    <button id="copy-button" aria-label="Copy content">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                    <button id="download-button" aria-label="Download file">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
            </div>
            <div class="file-content" id="fileContent"></div>
        </div>
    </div>
    <script src="/static/js/main.js"></script>
</body>

</html>
